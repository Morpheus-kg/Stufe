<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#B4532A">
  <meta name="color-scheme" content="light dark">
  <title>German Trainer</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <!-- Применяем тему до первой отрисовки, чтобы не было вспышки -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('gt-theme') || 'auto';
        if (t === 'dark')  document.documentElement.dataset.theme = 'dark';
        else if (t === 'light') document.documentElement.dataset.theme = 'light';
        // 'auto' — убираем атрибут, работает prefers-color-scheme
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app">
    <main id="view" tabindex="-1"></main>
    <nav id="tabbar" aria-label="Основное меню" hidden>
      <a href="#/today"    data-route="today"><span aria-hidden="true">🏠</span><span>Сегодня</span></a>
      <a href="#/cards"    data-route="cards"><span aria-hidden="true">🗂</span><span>Карточки</span></a>
      <a href="#/staging"  data-route="staging"><span aria-hidden="true">✨</span><span>Новые</span></a>
      <a href="#/stats"    data-route="stats"><span aria-hidden="true">📊</span><span>Статистика</span></a>
      <a href="#/settings" data-route="settings"><span aria-hidden="true">⚙️</span><span>Настройки</span></a>
    </nav>
    <div id="toasts" aria-live="polite"></div>
  </div>
  <noscript>Для работы приложения нужен JavaScript.</noscript>
  <script type="module" src="/js/app.js?v=5"></script>
</body>
</html>
